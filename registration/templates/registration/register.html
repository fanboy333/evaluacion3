{% extends "main/base.html" %}
{% load static %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 col-lg-5">
        <div class="card-custom p-4">
            <div class="text-center mb-4">
                <i class="bi bi-person-plus-fill display-4" style="color: var(--primary-dark);"></i>
                <h2 class="mt-2 h3">Crear Cuenta</h2>
                <p class="text-muted small">Regístrate para realizar y gestionar tus pedidos</p>
            </div>
            
            <form method="POST">
                {% csrf_token %}
                {{ form }}
                
                <button type="submit" class="btn btn-primary-custom w-100 py-2 mt-3">Registrarse</button>
            </form>
            
            <hr class="my-4" style="border-top: 1px solid var(--primary-light);">
            
            <div class="text-center">
                <p class="mb-0 text-muted">¿Ya tienes una cuenta?</p>
                <a href="{% url 'login' %}" class="btn btn-secondary-custom w-100 py-2 mt-2">Iniciar Sesión</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
