{% extends "main/base.html" %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 col-lg-5">
        <div class="card card-custom border-danger">
            <div class="card-header bg-danger text-white py-3 text-center" style="border-bottom: 1px solid rgba(255,255,255,0.2);">
                <h2 class="h4 m-0">Confirmar Eliminación</h2>
            </div>
            <div class="card-body p-4 text-center">
                <p class="fs-5">¿Estás seguro de que deseas eliminar el producto <strong>{{ producto.nombre }}</strong>?</p>
                <form method="POST" class="mt-4">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'product_list' %}" class="btn btn-secondary-custom px-4">Cancelar</a>
                        <button type="submit" class="btn btn-danger px-4" style="font-weight: 600; border-radius: 8px;">Eliminar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
